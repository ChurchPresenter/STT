            for (var i = 0; i < binaryStr.length; i++) {
              bytes[i] = binaryStr.charCodeAt(i);
            }

            ttsAudioCtx.decodeAudioData(bytes.buffer.slice(0), function(audioBuffer) {
              var source = ttsAudioCtx.createBufferSource();
              source.buffer = audioBuffer;
              source.connect(ttsAudioCtx.destination);
              source.onended = function() {
                ttsPlaying = false;
                playNextTTS();
              };
              source.start();
            }, function(err) {
              console.error('TTS decode error:', err);
              ttsPlaying = false;
              playNextTTS();
            });
          } catch(e) {
            console.error('TTS playback error:', e);
            ttsPlaying = false;
            playNextTTS();
          }
        }
      }



      // Detect manual scrolling and disable auto-scroll
      $(document).ready(function() {
        const container = $('#table-container')[0];
        let isUserScrolling = false;
        let programmaticScroll = false; // Flag to ignore programmatic scrolls

        // Scroll to bottom on page load
        setTimeout(() => {
          container.scrollTop = container.scrollHeight;
        }, 100);

        $(container).on('scroll', function() {
           // Ignore scroll events triggered by our own code
           if (programmaticScroll) {
             return;
           }

           // Check if user is at bottom
           const scrollTop = container.scrollTop;
           const scrollHeight = container.scrollHeight;
           const clientHeight = container.clientHeight;
           const isAtBottom = scrollTop + clientHeight >= scrollHeight - 10; // 10px threshold (more sensitive)

           if (!isAtBottom) {
             // User scrolled up, disable auto-scroll
             autoScrollEnabled = false;
             isUserScrolling = true;
           } else {
             // User is at bottom, immediately re-enable auto-scroll
             autoScrollEnabled = true;
             isUserScrolling = false;
           }
        });

        // Expose programmaticScroll flag globally for typing animation
        window.setProgrammaticScroll = function(value) {
          programmaticScroll = value;
        };

        // Hidden click zones for font size control
        $('#font-zone-left').on('click', function() {
          const currentSize = parseInt($('body').css('font-size'));
          const newSize = Math.max(currentSize - 4, 12);
          updateFontSize(newSize);
          // If inside an iframe, notify parent to update its URL
          if (window.parent !== window) {
            window.parent.postMessage({ type: 'iframeFontSizeChanged', size: newSize }, '*');
          }
        });

        $('#font-zone-right').on('click', function() {
          const currentSize = parseInt($('body').css('font-size'));
          const newSize = Math.min(currentSize + 4, 120);
          updateFontSize(newSize);
          if (window.parent !== window) {
            window.parent.postMessage({ type: 'iframeFontSizeChanged', size: newSize }, '*');
          }
        });

        function updateFontSize(size) {
          // Update both body and td to override responsive CSS
          $('body').css('font-size', size + 'px');
          $('td').css('font-size', size + 'px');
          // Update URL
          const url = new URL(window.location);
          url.searchParams.set('fontSize', size);
          window.history.replaceState({}, '', url);

          // Recalculate caption mode if active
          const maxLines = parseInt(url.searchParams.get('maxLines')) || 0;
          if (maxLines > 0) {
            // Re-measure line height with new font size
            const lineHeight = url.searchParams.get('lineHeight') || '1.5';
            const fontFamily = url.searchParams.get('fontFamily') || 'Arial';
            const measureTable = $('<table style="visibility: hidden; position: absolute;"><tbody><tr><td><div class="transcription-text"><span>Xg</span></div></td></tr></tbody></table>');
            measureTable.find('.transcription-text').css({
              'font-size': size + 'px',
              'line-height': lineHeight,
              'font-family': fontFamily
            });
            $("#table-container").append(measureTable);
            const actualLineHeight = measureTable.find('.transcription-text').height();
            measureTable.remove();

            // Update global line height and max-height
            window.captionLineHeight = actualLineHeight;
            const captionMaxHeight = Math.floor(maxLines * actualLineHeight);
            $("#table-container").css("max-height", captionMaxHeight + "px");
          }

          // Scroll to bottom after font size change
          const container = document.getElementById('table-container');
          if (container) {
            container.scrollTop = container.scrollHeight;
          }

          // Propagate to iframes in "both" mode
          const iframeOriginal = document.getElementById('iframe-original');
          const iframeTranslated = document.getElementById('iframe-translated');
          if (iframeOriginal?.contentWindow) {
            iframeOriginal.contentWindow.postMessage({ type: 'updateFontSize', size: size }, '*');
          }
          if (iframeTranslated?.contentWindow) {
            iframeTranslated.contentWindow.postMessage({ type: 'updateFontSize', size: size }, '*');
          }
        }

        // Listen for font size updates from parent (when running inside an iframe in "both" mode)
        window.addEventListener('message', function(event) {
          if (event.data?.type === 'updateFontSize') {
            updateFontSize(event.data.size);
          }
          // Listen for font size changes from iframes (when running as parent in "both" mode)
          if (event.data?.type === 'iframeFontSizeChanged') {
            const size = event.data.size;
            // Update parent URL
            const url = new URL(window.location);
            url.searchParams.set('fontSize', size);
            window.history.replaceState({}, '', url);
            // Update parent body CSS
            $('body').css('font-size', size + 'px');
            // Sync the other iframe
            const iframeOriginal = document.getElementById('iframe-original');
            const iframeTranslated = document.getElementById('iframe-translated');
            if (iframeOriginal?.contentWindow) {
              iframeOriginal.contentWindow.postMessage({ type: 'updateFontSize', size: size }, '*');
            }
            if (iframeTranslated?.contentWindow) {
              iframeTranslated.contentWindow.postMessage({ type: 'updateFontSize', size: size }, '*');
            }
          }
        });

      });
    </script>
