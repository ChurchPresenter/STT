         // Auto-scroll to show latest content (including in caption mode)
         if (autoScrollEnabled) {
           const container = document.getElementById('table-container');
           if (window.setProgrammaticScroll) {
             window.setProgrammaticScroll(true);
           }
           requestAnimationFrame(() => {
             let targetScroll = container.scrollHeight;
             if (window.captionLineHeight) {
               const lineHeight = window.captionLineHeight;
               const hiddenAbove = container.scrollHeight - container.clientHeight;
               const snappedHidden = Math.ceil(hiddenAbove / lineHeight) * lineHeight;
               targetScroll = snappedHidden;
             }
             container.scrollTo({ top: targetScroll, behavior: 'smooth' });
             setTimeout(() => {
               if (window.setProgrammaticScroll) {
                 window.setProgrammaticScroll(false);
               }
             }, 300);
           });
         }
       }

      // Socket.IO Connection Monitoring
      // Check transcription status on page load and periodically
      function checkTranscriptionStatus() {
        pollFetch('/api/transcription/status')
          .then(response => response.json())
          .then(data => {
            // Pass the full state object if available, otherwise fall back to boolean
            if (data.success && data.state) {
              updateTranscriptionStatus(data.state);
            } else {
              updateTranscriptionStatus(data.running || false);
            }
            // Disk-full warning rides along on this public poll (see server's
            // _disk_usage_percent) so non-whitelisted viewers get it without
            // hitting the IP-gated /api/disk-space endpoint.
            updateDiskBanner(data.disk_percent);
          })
          .catch(error => {
            console.error('Error checking transcription status:', error);
            updateTranscriptionStatus(false);
          });
      }

      // Update the disk-full warning from a usage percent (delivered on the
      // /api/transcription/status poll). Shows a banner at >= 75%, hides it
      // below. A null/undefined percent (probe failed) just leaves it hidden.
      function updateDiskBanner(percentUsed) {
        if (percentUsed === null || percentUsed === undefined) return;

        const container = document.getElementById('disk-status-container');
        const dot = document.getElementById('disk-status-dot');
        const text = document.getElementById('disk-status-text');

        if (percentUsed >= 75) {
          // Show disk space warning
          container.style.display = 'flex';

          // Set color based on severity
          dot.classList.remove('warning', 'error', 'inactive');
          if (percentUsed >= 90) {
            dot.classList.add('error');
            text.textContent = `Disk: ${percentUsed}% (Critical!)`;
          } else {
            dot.classList.add('warning');
            text.textContent = `Disk: ${percentUsed}% Used`;
          }
        } else {
          // Hide disk space status if below 75%
          container.style.display = 'none';
        }
      }

      // Initialize socket connection monitoring (called after socket is created)
      function initializeSocketMonitoring() {
        // Only run status polling if menu is shown (not in embedded/OBS mode)
        // In embedded mode, fetch calls may fail but WebSocket still works
        if (window.displayConfig.showMenu) {
          // Check status on load (disk-full warning rides along on the response)
          checkTranscriptionStatus();

          // Check status every 5 seconds
          setInterval(checkTranscriptionStatus, 5000);
        }

        // Clear segment/translation state and the drip-feed baselines, then
        // re-join audio rooms. Socket.IO only emits 'reconnect' for its own
        // automatic backoff reconnection — a manual socket.connect() (used by
        // the visibilitychange handler and the heartbeat watchdog below to
        // recover from a silently-dead connection) fires only 'connect'. This
        // is called from both handlers so a manual reconnect can't leave
        // stale state around to get glued onto the next update.
        resetSessionState = function () {
          // Clear segment state to reload fresh data on reconnect
          allSegments = [];
          lastIncompleteSegment = null;
          lastEndTime = 0;
          lastSegmentCount = 0;
          lastInProgressText = '';
          // Also clear the rendered-state cache: a new session restarts ids at
          // 1, so stale finalized text (and its drip baseline) could otherwise
          // survive and get glued in front of the new session's content
          _lastFinalizedHTML = '';
          _transcriptionStructureBuilt = false;
          _finalizedTextEl = null;
          _inProgressTextEl = null;
          resetDripState(false);
          // Also clear translation state: segments merge by id, and a new
          // session restarts ids at 1 — stale rows would collide with new ones
          allTranslatedSegments = [];
          lastTranslationInProgress = null;
          lastTranslatedSegmentCount = 0;
          lastTranslatedInProgressText = '';
          _lastTranslationFinalizedHTML = '';
          _translationStructureBuilt = false;
          _translationFinalizedEl = null;
          _translationInProgressEl = null;
          resetDripState(true);
          // Re-join audio streaming rooms after reconnect (e.g. server restart)
          if (window.displayConfig.audioStream) {
            socket.emit('join_audio_stream');
            // Reset scheduling only if not currently playing (next play time is in the past)
            if (!audioStreamCtx || audioStreamNextPlayTime < audioStreamCtx.currentTime) {
              audioStreamNextPlayTime = 0;
            }
            if (audioStreamCtx && audioStreamCtx.state === 'suspended') {
              audioStreamCtx.resume();
            }
          }
          if (window.displayConfig.ttsAudio) {
            socket.emit('join_tts_audio');
          }
        };

        socket.on('connect', function() {
          // console.log('WebSocket connected');
          updateServerStatus(true);
          if (window.displayConfig.showMenu) {
            checkTranscriptionStatus();
          }
          if (window.displayConfig.showAll) {
            socket.emit('request_all_entries');
            socket.emit('request_all_translation_entries');
          }
          // Join audio streaming rooms if enabled via URL params
          if (window.displayConfig.audioStream) {
            socket.emit('join_audio_stream');
          }
          if (window.displayConfig.ttsAudio) {
            socket.emit('join_tts_audio');
          }
          resetSessionState();
        });

        socket.on('disconnect', function() {
          // console.log('WebSocket disconnected');
          updateServerStatus(false);
        });

        socket.on('reconnecting', function(attemptNumber) {
          // console.log('Reconnecting attempt:', attemptNumber);
        });

        socket.on('reconnect', function() {
          // console.log('Reconnected - reloading transcription history');
          updateServerStatus(true);
          if (window.displayConfig.showMenu) {
            checkTranscriptionStatus();
          }
          resetSessionState();
        });

        socket.on('error', function(error) {
          console.error('Socket error:', error);
        });

        // =====================================================================
        // Live Audio Stream Playback (Web Audio API)
        // =====================================================================
        var audioStreamCtx = null;
        var audioStreamNextPlayTime = 0;
        var audioStreamSampleRate = 16000;

        socket.on('audio_stream_info', function(data) {
          audioStreamSampleRate = data.sample_rate || 16000;
        });

        socket.on('audio_chunk', function(data) {
          if (!window.displayConfig.audioStream) return;
          if (!audioUnlocked) return;

          // Initialize AudioContext on first chunk
          if (!audioStreamCtx) {
            try {
              audioStreamCtx = new (window.AudioContext || window.webkitAudioContext)({
                sampleRate: audioStreamSampleRate
              });
            } catch(e) {
              console.error('Failed to create AudioContext:', e);
              return;
            }
          }
          if (audioStreamCtx.state === 'suspended') {
            audioStreamCtx.resume();
          }

          // Convert Int16 PCM bytes to Float32 for Web Audio API
          var int16Array = new Int16Array(data);
          var float32Array = new Float32Array(int16Array.length);
          for (var i = 0; i < int16Array.length; i++) {
            float32Array[i] = int16Array[i] / 32768.0;
          }

          // Create and schedule audio buffer for gapless playback
          var buffer = audioStreamCtx.createBuffer(1, float32Array.length, audioStreamSampleRate);
          buffer.getChannelData(0).set(float32Array);

          var source = audioStreamCtx.createBufferSource();
          source.buffer = buffer;
          source.connect(audioStreamCtx.destination);

          var currentTime = audioStreamCtx.currentTime;
          // Only snap forward if not yet started (first chunk or after reconnect reset)
          if (audioStreamNextPlayTime === 0) {
            audioStreamNextPlayTime = currentTime + 0.02;
          }
          source.start(audioStreamNextPlayTime);
          audioStreamNextPlayTime += buffer.duration;
        });

        // =====================================================================
        // TTS Audio Playback (for translated text)
        // =====================================================================
        var ttsQueue = [];
        var ttsPlaying = false;
        var ttsAudioCtx = null;

        // Audio unlock overlay — shown on page reload (browser autoplay policy blocks audio after refresh)
        var audioUnlocked = false;
        var audioOverlay = document.getElementById('audio-unlock-overlay');

        if (window.displayConfig.audioStream || window.displayConfig.ttsAudio) {
          var navEntry = performance.getEntriesByType('navigation')[0];
          var isReload = navEntry ? navEntry.type === 'reload' : false;
          if (isReload) {
            audioOverlay.style.display = 'flex';
          } else {
            audioUnlocked = true;
          }
        }

        audioOverlay.addEventListener('click', function() {
          audioUnlocked = true;
          audioOverlay.style.display = 'none';
          if (window.displayConfig.audioStream) {
            if (!audioStreamCtx) {
              try {
                audioStreamCtx = new (window.AudioContext || window.webkitAudioContext)({
                  sampleRate: audioStreamSampleRate
                });
              } catch(e) { /* will retry on first chunk */ }
            }
            if (audioStreamCtx && audioStreamCtx.state === 'suspended') {
              audioStreamCtx.resume();
            }
          }
          if (window.displayConfig.ttsAudio) {
            if (!ttsAudioCtx) {
              try {
                ttsAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
              } catch(e) { /* will retry on first event */ }
            }
            if (ttsAudioCtx && ttsAudioCtx.state === 'suspended') {
              ttsAudioCtx.resume();
            }
          }
        });

        socket.on('tts_audio', function(data) {
          if (!window.displayConfig.ttsAudio) return;
          if (!audioUnlocked) return;
          ttsQueue.push(data);
          ttsQueue.sort(function(a, b) { return a.segment_id - b.segment_id; });
          // Limit queue size - drop old unplayed segments
          if (ttsQueue.length > 5) {
            ttsQueue = ttsQueue.slice(-3);
          }
          playNextTTS();
        });

        function playNextTTS() {
          if (ttsPlaying || ttsQueue.length === 0) return;
          ttsPlaying = true;

          var item = ttsQueue.shift();
          try {
            if (!ttsAudioCtx) {
              ttsAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (ttsAudioCtx.state === 'suspended') {
              ttsAudioCtx.resume();
            }

            // Decode base64 OGG audio
            var binaryStr = atob(item.audio);
            var bytes = new Uint8Array(binaryStr.length);
            for (var i = 0; i < binaryStr.length; i++) {
              bytes[i] = binaryStr.charCodeAt(i);
            }

            ttsAudioCtx.decodeAudioData(bytes.buffer.slice(0), function(audioBuffer) {
              var source = ttsAudioCtx.createBufferSource();
              source.buffer = audioBuffer;
              source.connect(ttsAudioCtx.destination);
              source.onended = function() {
                ttsPlaying = false;
                playNextTTS();
              };
              source.start();
            }, function(err) {
              console.error('TTS decode error:', err);
              ttsPlaying = false;
              playNextTTS();
            });
          } catch(e) {
            console.error('TTS playback error:', e);
            ttsPlaying = false;
            playNextTTS();
          }
        }
      }



      // Detect manual scrolling and disable auto-scroll
      $(document).ready(function() {
        const container = $('#table-container')[0];
        let programmaticScroll = false; // Flag to ignore programmatic scrolls
        let userGestureUntil = 0;       // scroll events only count while an input gesture is live

        // Scroll to bottom on page load
        setTimeout(() => {
          container.scrollTop = container.scrollHeight;
          probeLiveEdge();
        }, 100);

        // Reading back through what was said means scrolling up, which pauses the
        // auto-scroll — otherwise the next caption yanks the view to the bottom
        // mid-sentence. The pill is the way back: while it is showing, the display
        // is deliberately not following the live edge, and one click resumes.
        // Never offered on a bare output surface, where there is nobody to click
        // it and it would be captured into the projection.
        const jumpBtn = document.getElementById('jump-latest-btn');
        function updateJumpButton() {
          if (!jumpBtn) return;
          const offer = !autoScrollEnabled && window.displayConfig?.allowJumpPill !== false;
          jumpBtn.classList.toggle('visible', offer);
        }
        window.updateJumpButton = updateJumpButton;

        if (jumpBtn) {
          jumpBtn.addEventListener('click', function() {
            autoScrollEnabled = true;
            // Jump rather than glide: a smooth scroll fires scroll events all the
            // way down, each of them "not at the bottom", which would flash the
            // pill back on for the length of the animation.
            container.scrollTop = container.scrollHeight;
            probeLiveEdge();
            // Close any gesture window still open from the scroll that led here,
            // so the resumed auto-scroll's own movement cannot be mistaken for
            // the user scrolling away again.
            userGestureUntil = 0;
            updateJumpButton();
          });
        }

        // Where the live edge sits in scrollTop terms is not fixed. The default
        // layout (verticalAlign=bottom) makes the container a column-reverse flex
        // box, and browsers put the scroll origin of a reversed box at its flex
        // start — the visual bottom — so scrollTop reads ~0 at the latest text and
        // runs negative as the reader goes back. Measuring "bottom" as
        // scrollTop + clientHeight >= scrollHeight was therefore never true there:
        // the pill's jump still landed correctly (the browser clamps it), but the
        // pill itself never went away.
        //
        // Rather than guess the convention per browser, learn it: any scroll we
        // drove ourselves ends at the live edge by construction, so reading
        // scrollTop back at that moment says which end it is.
        const BOTTOM_SLACK_PX = 10;
        let liveEdgeAtOrigin = false;
        function scrollable() {
          return container.scrollHeight - container.clientHeight > BOTTOM_SLACK_PX;
        }
        function probeLiveEdge() {
          if (!scrollable()) return;  // no overflow: scrollTop is 0 either way, tells us nothing
          liveEdgeAtOrigin = container.scrollTop <= 0;
        }
        window.probeLiveEdge = probeLiveEdge;
        function atLiveEdge() {
          if (!scrollable()) return true;
          return liveEdgeAtOrigin
            ? container.scrollTop >= -BOTTOM_SLACK_PX
            : container.scrollTop + container.clientHeight >= container.scrollHeight - BOTTOM_SLACK_PX;
        }

        // Scrolling back down to the bottom by hand resumes following — but the
        // scroll handler alone could miss it: the last scroll event of the gesture
        // may land in the same frame as a render that has just appended a line, so
        // the reader is measured against content that arrived after they got there
        // and stays pinned as "scrolled up" with nobody left to fire another
        // event. Renders therefore re-check the position they inherited, before
        // touching the DOM.
        window.refreshAutoScrollFromPosition = function() {
          if (autoScrollEnabled) return;
          if (!atLiveEdge()) return;
          autoScrollEnabled = true;
          updateJumpButton();
        };

        // Only a real input gesture may pause the auto-scroll. Inferring intent
        // from scroll events alone made one click on the pill insufficient: the
        // click resumes following, the next caption starts a *smooth* programmatic
        // scroll, and that animation outlives its 300ms guard on any real scroll
        // distance — its trailing events then read as "the user scrolled up" and
        // the pill came straight back, so it took a second click to stick.
        const GESTURE_WINDOW_MS = 700;  // covers momentum/rubber-band after the input ends
        function markUserGesture() {
          userGestureUntil = performance.now() + GESTURE_WINDOW_MS;
        }
        const SCROLL_KEYS = new Set(['ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', 'Home', 'End', ' ', 'Spacebar']);
        container.addEventListener('wheel', markUserGesture, { passive: true });
        container.addEventListener('touchmove', markUserGesture, { passive: true });
        // Scrollbar drags and arrow clicks land on the container itself.
        container.addEventListener('pointerdown', markUserGesture);
        document.addEventListener('keydown', function(e) {
          if (SCROLL_KEYS.has(e.key)) markUserGesture();
        });

        $(container).on('scroll', function() {
           // Ignore scroll events triggered by our own code
           if (programmaticScroll) {
             return;
           }
           // ...and any scroll that no input gesture asked for.
           if (performance.now() > userGestureUntil) {
             return;
           }
           // A gesture that is still moving keeps the window open, so a long
           // flick is not cut off halfway by the timeout.
           markUserGesture();

           // A negative scrollTop can only mean a reversed box scrolled back from
           // its origin, which settles the question on its own.
           if (container.scrollTop < -1) liveEdgeAtOrigin = true;

           // Scrolled up: stop following the live edge. Back at the bottom:
           // resume immediately, so returning by hand needs no click.
           autoScrollEnabled = atLiveEdge();
           updateJumpButton();
        });

        // Expose programmaticScroll flag globally for typing animation
        window.setProgrammaticScroll = function(value) {
          programmaticScroll = value;
          // Released once the auto-scroll has landed, i.e. sitting at the live
          // edge — the one moment where reading scrollTop back is meaningful.
          if (!value) probeLiveEdge();
          // A scroll we started ourselves ends the gesture window: whatever the
          // user did last is over, and the smooth animation that follows must not
          // inherit their intent.
          if (value) userGestureUntil = 0;
        };

        // Hidden click zones for font size control
        $('#font-zone-left').on('click', function() {
          const currentSize = parseInt($('body').css('font-size'));
          const newSize = Math.max(currentSize - 4, 12);
          updateFontSize(newSize);
          // If inside an iframe, notify parent to update its URL
          if (window.parent !== window) {
            window.parent.postMessage({ type: 'iframeFontSizeChanged', size: newSize }, window.location.origin);
          }
        });

        $('#font-zone-right').on('click', function() {
          const currentSize = parseInt($('body').css('font-size'));
          const newSize = Math.min(currentSize + 4, 120);
          updateFontSize(newSize);
          if (window.parent !== window) {
            window.parent.postMessage({ type: 'iframeFontSizeChanged', size: newSize }, window.location.origin);
          }
        });

        function updateFontSize(size) {
          // Update both body and td to override responsive CSS
          $('body').css('font-size', size + 'px');
          $('td').css('font-size', size + 'px');
          // Update URL
          const url = new URL(window.location);
          url.searchParams.set('fontSize', size);
          window.history.replaceState({}, '', url);

          // Recalculate caption mode if active
          const maxLines = numParam(url.searchParams, 'maxLines', 0);
          if (maxLines > 0) {
            // Re-measure line height with new font size
            const lineHeight = url.searchParams.get('lineHeight') || '1.5';
            const fontFamily = url.searchParams.get('fontFamily') || 'Arial';
            const measureTable = $('<table style="visibility: hidden; position: absolute;"><tbody><tr><td><div class="transcription-text"><span>Xg</span></div></td></tr></tbody></table>');
            measureTable.find('.transcription-text').css({
              'font-size': size + 'px',
              'line-height': lineHeight,
              'font-family': fontFamily
            });
            $("#table-container").append(measureTable);
            const actualLineHeight = measureTable.find('.transcription-text').height();
            measureTable.remove();

            // Update global line height and max-height
            window.captionLineHeight = actualLineHeight;
            const captionMaxHeight = Math.floor(maxLines * actualLineHeight);
            $("#table-container").css("max-height", captionMaxHeight + "px");
          }

          // Scroll to bottom after font size change
          const container = document.getElementById('table-container');
          if (container) {
            container.scrollTop = container.scrollHeight;
          }

          // Propagate to iframes in "both" mode
          const iframeOriginal = document.getElementById('iframe-original');
          const iframeTranslated = document.getElementById('iframe-translated');
          if (iframeOriginal?.contentWindow) {
            iframeOriginal.contentWindow.postMessage({ type: 'updateFontSize', size: size }, window.location.origin);
          }
          if (iframeTranslated?.contentWindow) {
            iframeTranslated.contentWindow.postMessage({ type: 'updateFontSize', size: size }, window.location.origin);
          }
        }

        // Listen for font size updates from parent (when running inside an iframe in "both" mode)
        window.addEventListener('message', function(event) {
          // "both" mode embeds this same page from this same origin, so anything
          // from elsewhere is not part of that conversation.
          if (event.origin !== window.location.origin) return;
          if (event.data?.type === 'updateFontSize') {
            updateFontSize(event.data.size);
          }
          // Listen for font size changes from iframes (when running as parent in "both" mode)
          if (event.data?.type === 'iframeFontSizeChanged') {
            const size = event.data.size;
            // Update parent URL
            const url = new URL(window.location);
            url.searchParams.set('fontSize', size);
            window.history.replaceState({}, '', url);
            // Update parent body CSS
            $('body').css('font-size', size + 'px');
            // Sync the other iframe
            const iframeOriginal = document.getElementById('iframe-original');
            const iframeTranslated = document.getElementById('iframe-translated');
            if (iframeOriginal?.contentWindow) {
              iframeOriginal.contentWindow.postMessage({ type: 'updateFontSize', size: size }, window.location.origin);
            }
            if (iframeTranslated?.contentWindow) {
              iframeTranslated.contentWindow.postMessage({ type: 'updateFontSize', size: size }, window.location.origin);
            }
          }
        });

      });
    </script>
  </body>
</html>
