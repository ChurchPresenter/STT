name: Tests

# Day-to-day gate: build.yml only runs the suite on release tags, so this
# workflow covers every push and PR.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Every platform the project ships to. This is not
    # belt-and-braces: a WAL-mode sqlite read that raises on macOS silently
    # succeeds on Linux and writes sidecar files, and the module it lived in was
    # at 100% coverage. Only running the suite on each surfaces that class,
    # and Windows ships an installer and a signed build that nothing else here
    # exercises.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.11"
      - name: Install test deps
        run: |
          # stt/ modules and the ast-inspection tests (see tests/conftest.py)
          # need no ML runtime deps.
          uv venv
          uv pip install -r requirements-dev.txt certifi
      - name: Lint
        run: uv run ruff check .
      - name: Type check (stt/ package)
        run: uv run mypy
      - name: Test with coverage
        # Ratchet: fail only if stt/ coverage drops below the recorded
        # watermark (65% measured 2026-05-21, minus slack for platform-specific
        # lines that only one runner executes). Raise it as coverage grows;
        # never lower it. The remaining gap to 100% is audio_capture, watchdog
        # and file_mover — ffmpeg, process management and SMB — where a unit
        # test would mostly assert its own mocks; the logic modules are at
        # 88-100%.
        run: uv run pytest --cov --cov-report=term --cov-fail-under=63
